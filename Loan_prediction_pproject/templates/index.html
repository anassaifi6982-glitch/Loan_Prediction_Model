
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanWise | Loan Prediction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172b4d;
        }

        header {
            background: #10243a;
            color: white;
            padding: 22px 8%;
        }

        header h2 {
            margin: 0;
            color: #7dd3fc;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #10243a12;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            background: #176b87;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #12566d;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px 12px;
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h2>LoanWise</h2>
        <p>Smart Loan Prediction System</p>
    </header>

    <main>
        <h1>Check Your Loan Eligibility</h1>
        <p class="subtitle">
            Enter your details to check your predicted loan eligibility.
        </p>

        <form action="/predict" method="POST">
            <div class="form-grid">
                <div>
                    <label for="gender">Gender</label>
                    <select id="gender" name="Gender" required>
                        <option value="">Select gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div>
                    <label for="married">Marital Status</label>
                    <select id="married" name="Married" required>
                        <option value="">Select status</option>
                        <option value="Yes">Married</option>
                        <option value="No">Not Married</option>
                    </select>
                </div>

                <div>
                    <label for="dependents">Dependents</label>
                    <select id="dependents" name="Dependents" required>
                        <option value="">Select dependents</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3+">3+</option>
                    </select>
                </div>

                <div>
                    <label for="education">Education</label>
                    <select id="education" name="Education" required>
                        <option value="">Select education</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Not Graduate">Not Graduate</option>
                    </select>
                </div>

                <div>
                    <label for="self_employed">Self Employed</label>
                    <select id="self_employed" name="Self_Employed" required>
                        <option value="">Select option</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div>
                    <label for="applicant_income">Applicant Income</label>
                    <input id="applicant_income" name="ApplicantIncome"
                           type="number" min="0" placeholder="Enter income" required>
                </div>

                <div>
                    <label for="coapplicant_income">Coapplicant Income</label>
                    <input id="coapplicant_income" name="CoapplicantIncome"
                           type="number" min="0" placeholder="Enter coapplicant income" required>
                </div>

                <div>
                    <label for="loan_amount">Loan Amount</label>
                    <input id="loan_amount" name="LoanAmount"
                           type="number" min="0" placeholder="Enter loan amount" required>
                </div>

                <div>
                    <label for="loan_term">Loan Term (days)</label>
                    <input id="loan_term" name="Loan_Amount_Term"
                           type="number" min="0" placeholder="Enter loan term" required>
                </div>

                <div>
                    <label for="credit_history">Credit History</label>
                    <select id="credit_history" name="Credit_History" required>
                        <option value="">Select credit history</option>
                        <option value="1">Good (1)</option>
                        <option value="0">Poor (0)</option>
                    </select>
                </div>

                <div>
                    <label for="property_area">Property Area</label>
                    <select id="property_area" name="Property_Area" required>
                        <option value="">Select area</option>
                        <option value="Urban">Urban</option>
                        <option value="Semiurban">Semiurban</option>
                        <option value="Rural">Rural</option>
                    </select>
                </div>
            </div>

            <button type="submit">Check Loan Eligibility</button>
        </form>
        {% if prediction_text %}
            <div class="result">
                {{ prediction_text }}
            </div>
        {% endif %}
    </main>

    <footer>
        LoanWise · Machine Learning Project
        <br>
        Prediction is an estimate, not a bank approval.
    </footer>
</body>
</html>
